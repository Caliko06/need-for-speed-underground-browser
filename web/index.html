// RN_SEARCH = the switches of this visit: this tab's choice (sessionStorage rn_q, written by the launcher's Jugar, web/overlay.js and the

</script>

<script>
// ?fast=1&go=1 (the launcher's "Jugar"): the launcher's 3D scene (web/launcher_b/index.html?curtain=1, named in full: R2 maps only / to index.html, a folder URL is a 404 page; frozen at the end of its push-in) covers the game while it boots
// (no intro movies or splash, PATCH 0x4de395). It is only a loading curtain: it fades out in 250 ms
// when RN_APP leaves 'load' (web/app.js: the player is where the launcher's entry leads: main menu or Go Underground, web/boot.js ?start=; or a stop that must show). Opened without go=1 (set at the top of this page) it never gets here.
if (RN_Q.get('fast') === '1') {
  const css = document.createElement('style');
  css.textContent = `#ab { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 12; background: #05080d; pointer-events: none; transition: opacity .25s ease; }
    @media (prefers-reduced-motion: reduce) { #ab { transition: none; } }`;
  document.head.appendChild(css);
  const ab = Object.assign(document.createElement('iframe'), { id: 'ab', src: '/launcher_b/index.html?curtain=1', tabIndex: -1 });
  document.body.append(ab);
  // The WASM boot waits (web/boot.js awaits RN_HOLD) until the scene has drawn its first frame (RN_B.ready, same origin) or 1.5 s: the game's boot would starve it (GPU, main thread).
  const t0b = performance.now();
  window.RN_HOLD = new Promise(res => { const f = () => { if (ab.contentWindow?.RN_B?.ready || performance.now() - t0b > 1500) { window.RN_AB_MS = Math.round(performance.now() - t0b); res(); } else setTimeout(f, 40); }; f(); });
  RN_APP.on(s => {
    if (s === 'load' || !ab.isConnected || ab.style.opacity === '0') return;
    ab.style.opacity = '0';
    setTimeout(() => { ab.remove(); document.getElementById('screen').focus(); }, 260);
  });
}
</script>
